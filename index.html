<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Connexion au Chat</title>
  <link rel="stylesheet" href="style-login.css">
</head>
<body>
  <div class="chat-container">
    <h2>Entre ton pseudo</h2>
    <form id="login-form">
      <input type="text" id="pseudo-input" placeholder="Ton pseudo..." required autocomplete="off">
      <select id="emoji">
        <option value="👤">👤</option>
        <option value="🐱">🐱</option>
        <option value="🤖">🤖</option>
        <option value="🧙">🧙</option>
        <option value="🐉">🐉</option>
        <option value="🤡">🤡</option>
        <option value="🤓">🤓</option>
        <option value="🌚">🌚</option>
        <option value="👹">👹</option>
        <option value="😎">😎</option>
        <option value="😀">😀</option>
        <option value="😈">😈</option>
        <option value="💋">💋</option>
      </select>
      <button type="submit">Entrer</button>
    </form>
  </div>

  <script>
 document.getElementById("login-form").addEventListener("submit", function(e) {
  e.preventDefault();
  const pseudo = document.getElementById("pseudo-input").value.trim();
  const emoji = document.getElementById("emoji").value;

  if (pseudo !== "") {
    localStorage.setItem("pseudo", pseudo);
    localStorage.setItem("emoji", emoji); 
    window.location.href = "chat.html";
  }
});
  </script>
</body>
</html>
